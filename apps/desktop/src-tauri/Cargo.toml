[package]
name = "devpilot-desktop"
version = "0.1.0"
description = "DevPilot Windows desktop shell"
authors = ["DevPilot Project"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devpilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.2.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
